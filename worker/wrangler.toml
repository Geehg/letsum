# LETSUM 좋아요·댓글 API — Cloudflare Workers 무료 플랜 + D1(무료).
# letsum.app/api/* 로만 동작하고 나머지 주소는 기존처럼 NAS(정적 사이트)로 간다.
# 무료 한도를 넘으면 요청이 실패할 뿐 청구되지 않는다(유료 플랜으로 바꾸지 말 것).
name = "letsum-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [{ pattern = "letsum.app/api/*", zone_name = "letsum.app" }, { pattern = "type.letsum.app/api/*", zone_name = "letsum.app" }]

# 매일 03:17(UTC): 필사독서 만료 세션·장기 미접속 회원 정리
[triggers]
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "letsum"
database_id = "8f3f484b-da6e-4e4d-a6d5-7e071d3295c1"
migrations_dir = "migrations"

# 관리자 로그인 확인용(비밀번호 자체가 아니라 SHA-256 값 — html/js/data.js의 ADMIN_ACCOUNT와 같게 유지)
[vars]
ADMIN_ID = "admin"
ADMIN_PW_HASH = "689db2d3a68fce03c7663845092dc7d58fc43085b39c38d146682cf1e7625ed3"
# 필사독서 선택 회원 — 시행일(KST) 전에는 로그인 경로가 닫혀 있다. 공개 클라이언트 ID는 앱 등록 후 채운다(비밀값은 wrangler secret)
AUTH_FROM = "2026-10-26"
# 버튼만 보이고 쓸 수 없는 로그인(쉼표 목록). 네이버 검수 승인 후 "" 로 비우고 배포하면 켜짐
AUTH_PAUSED = "naver"
KAKAO_CLIENT_ID = "095409f059a5d17790cf025c3216b370"
NAVER_CLIENT_ID = "_CkQphkwualJXZMvBJud"
GOOGLE_CLIENT_ID = "141373438831-1oa7j1q3gi2hld0fe1hn4i5vf8lf2rs3.apps.googleusercontent.com"

# 비밀 값(코드·저장소에 넣지 않음): wrangler secret put ADMIN_KEY / VOTER_SALT / AUTH_SALT / NAVER_CLIENT_SECRET / GOOGLE_CLIENT_SECRET / KAKAO_CLIENT_SECRET(선택)

# 과다 요청 차단(무료): IP별 10초 한도(40회). 넘으면 429. 화면 사용(피드 스크롤·상세 열기)은 1분 10~30회 정도라 닿지 않음. Cloudflare 계산이 근사라 실제로는 한도보다 조금 더 허용됨.
[[ratelimits]]
name = "API_RL"
namespace_id = "1001"
simple = { limit = 40, period = 10 }

# 관리자 주소는 비밀번호 대입 방지로 더 좁게
[[ratelimits]]
name = "ADMIN_RL"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
