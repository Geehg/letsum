# type.letsum.app — 필사독서 별도 사이트. 첫 화면만 type/index.html이고 css·js·data/typing·img는 letsum.app과 같은 파일.
# 그 밖의 주소(폰트 페이지 등)는 letsum.app으로 넘긴다.
server {
  listen 80;
  server_name type.letsum.app;
  root /usr/share/nginx/html;
  etag on;
  location = / { add_header Cache-Control "no-cache, must-revalidate"; try_files /type/index.html =404; }
  location = /index.html { return 301 https://type.letsum.app/; }
  location = /robots.txt { try_files /type/robots.txt =404; }
  location = /sitemap.xml { add_header Cache-Control "no-cache, must-revalidate"; try_files /type/sitemap.xml =404; }
  location ~ ^/(css|js|img|data/typing)/ {
    location ~* \.(css|js|json)$ { add_header Cache-Control "no-cache, must-revalidate"; }
    try_files $uri =404;
  }
  location ~ ^/(favicon[^/]*|img/apple-touch-icon\.png)$ { try_files $uri =404; }
  location / { return 301 https://letsum.app$request_uri; }
}

# letsum.app 정적 서빙. Cloudflare가 css/js를 4시간 캐시해 배포 직후 옛 파일이 보이는 문제를 막기 위해
# css/js/html은 캐시하지 않도록 내보낸다(파일이 작아 성능 영향 없음).
server {
  listen 80 default_server;  # type.letsum.app 블록이 위에 있어도 letsum.app·그 밖의 주소는 이 블록으로
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  etag on;
  location ~* \.(css|js|html|json|xml)$ { add_header Cache-Control "no-cache, must-revalidate"; }
  error_page 404 /404.html;
  location = /404.html { internal; add_header Cache-Control "no-cache, must-revalidate" always; } # always: 404 응답에도 붙여 Cloudflare가 404를 캐시하지 않게
  # 재배포 금지 라이선스 폰트(서울서체·HS효성체·GS혜자로운체): letsum.app 화면에서 불러올 때만 내준다.
  # 주소를 직접 열거나 다른 사이트가 가져다 쓰면 403. Cloudflare가 캐시하면 이 확인을 건너뛰므로 private(브라우저만 캐시).
  location ^~ /fonts-hosted/ {
    valid_referers letsum.app www.letsum.app;
    if ($invalid_referer) { return 403; }
    add_header Cache-Control "private, max-age=604800" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # 원본 TTF·OTF는 전송할 때만 gzip으로 압축(받은 파일은 원본과 같음 — 형식 변환 아님). TTF가 60~75% 줄어든다.
    types { font/ttf ttf; font/otf otf; font/woff2 woff2; font/woff woff; }
    gzip on;
    gzip_types font/ttf font/otf;
    gzip_min_length 1024;
    gzip_vary on;
    try_files $uri =404;
  }
  # 필사독서는 type.letsum.app 으로 옮김(2026-10-25) — /typing.html 은 소개·링크 페이지로 남김
  location ^~ /type/ { return 301 https://type.letsum.app/; }
  location / { try_files $uri $uri/ =404; }
}
