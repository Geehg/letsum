# letsum.app 정적 서빙. Cloudflare가 css/js를 4시간 캐시해 배포 직후 옛 파일이 보이는 문제를 막기 위해
# css/js/html은 캐시하지 않도록 내보낸다(파일이 작아 성능 영향 없음).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  etag on;
  location ~* \.(css|js|html)$ { add_header Cache-Control "no-cache, must-revalidate"; }
  location / { try_files $uri $uri/ =404; }
}
