<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 — LETSUM(렛섬)</title>
<script>try{var t=localStorage.getItem("ls_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta property="og:site_name" content="LETSUM(렛섬)"><meta property="og:type" content="website"><meta property="og:title" content="관리자 — LETSUM(렛섬)"><meta property="og:description" content="상업용 무료 한글 폰트를 실제 쓰임새에서 비교하고, 글자 지원과 라이선스까지 한 화면에서 확인합니다.">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<header>
  <div class="wrap hd">
    <a class="logo" href="index.html">렛섬 <small>LETSUM</small></a>
    <nav class="main">
      <a href="index.html">작업대</a>
      <a href="guide.html">라이선스 가이드</a>
      <a href="subset.html">서브셋 도구</a>
    </nav>
    <div class="sp"></div>
  </div>
</header>

<main class="wrap page">
  <!-- 로그인 -->
  <div id="loginView">
    <div class="login-box">
      <h1 style="font-size:22px">관리자 로그인</h1>
      <form class="demo" id="loginForm" style="margin-top:0">
        <label>아이디 <input id="aid" autocomplete="username"></label>
        <label>비밀번호 <input id="apw" type="password" autocomplete="current-password"></label>
        <button class="btn blue" type="submit">로그인</button>
        <p class="note" id="loginMsg"></p>
      </form>
    </div>
  </div>

  <!-- 대시보드 -->
  <div id="dashView" style="display:none">
    <h1>관리자</h1>
    <p class="lead" id="statLine"></p>
    <div class="toolbar">
      <button class="btn sm blue" id="addBtn">+ 폰트 추가</button>
      <button class="btn sm ghost" id="resetBtn">데모 데이터 초기화</button>
      <button class="btn sm ghost" id="logoutBtn">로그아웃</button>
      <span class="note">이 화면의 변경은 이 브라우저에만 저장됩니다. 사이트 데이터는 저장소(data.js)에서 관리합니다.</span>
    </div>

    <h2>폰트 목록</h2>
    <table class="admin">
      <thead><tr><th>폰트명</th><th>분류</th><th>제작자</th><th>라이선스</th><th>검수 상태</th><th>최종 검수일</th><th></th></tr></thead>
      <tbody id="fontRows"></tbody>
    </table>

    <h2>등록 신청 내역</h2>
    <div id="submitList"><p class="note">접수된 신청이 없습니다.</p></div>
  </div>
</main>

<!-- 폰트 편집 모달 -->
<div class="overlay" id="editOverlay">
  <div class="modal" style="max-width:520px">
    <button class="x" id="editX" aria-label="닫기">×</button>
    <h2 style="font-size:20px;font-weight:800" id="editTitle">폰트 추가</h2>
    <form class="demo" id="editForm">
      <input type="hidden" id="ef-id">
      <label>폰트명 <input id="ef-name" required></label>
      <label>영문명 <input id="ef-en" required placeholder="예: New Font"></label>
      <label>분류
        <select id="ef-cat"><option>고딕</option><option>명조</option><option>손글씨</option><option>디스플레이</option></select>
      </label>
      <label>제작자 <input id="ef-designer" required></label>
      <label>검수 상태
        <select id="ef-status"><option value="verified">검수 완료</option><option value="checking">확인 중</option></select>
      </label>
      <label>소개 <textarea id="ef-desc" rows="3"></textarea></label>
      <button class="btn blue" type="submit">저장</button>
      <p class="note">미리보기는 기본 폰트 패밀리로 표시됩니다.</p>
    </form>
  </div>
</div>

<footer>
  <div class="wrap"><p class="fine">LETSUM(렛섬) 관리자</p></div>
</footer>

<script src="js/data.js?v=2"></script>
<script src="js/admin.js?v=2"></script>
</body>
</html>
